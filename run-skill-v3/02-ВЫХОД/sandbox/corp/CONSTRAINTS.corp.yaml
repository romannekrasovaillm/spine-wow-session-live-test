version: '2026.2'
constraints:
- id: C-PAY-001
  name: no_float_for_money
  type: must_not_contain
  glob:
  - src/**/*.rs
  pattern: \bf(32|64)\b
  std_ref: Стандарт платёжного ядра §2.1
  rationale: '[Стандарт платёжного ядра §2.1] денежные суммы не хранятся в типах с
    плавающей точкой'
  fix_hint: использовать целочисленные минорные единицы (u64/i64)
  severity: warn
  owner: '@dka-payments'
  applies_to:
  - payment-core
- id: C-PAY-002
  name: thiserror_for_errors
  type: must_contain
  glob: Cargo.toml
  pattern: thiserror
  std_ref: Стандарт платёжного ядра §3.2
  rationale: '[Стандарт платёжного ядра §3.2] ошибки домена описываются типизированно
    через thiserror'
  fix_hint: derive(thiserror::Error) на enum ошибок домена
  severity: warn
  owner: '@dka-payments'
  applies_to:
  - payment-core
- id: C-PAY-005
  name: no_anyhow_in_code
  type: must_not_contain
  glob:
  - '**/*.rs'
  pattern: anyhow::|Box<dyn
  std_ref: Стандарт платёжного ядра §3.2
  rationale: '[Стандарт платёжного ядра §3.2] anyhow и Box<dyn Error> в коде домена
    запрещены'
  severity: warn
  owner: '@dka-payments'
- id: C-PAY-003
  name: authorize_idempotent
  type: must_contain
  glob:
  - src/**/*.rs
  pattern: '[Ii]dempotenc'
  std_ref: Стандарт платёжного ядра §4.1
  rationale: '[Стандарт платёжного ядра §4.1] авторизация платежа идемпотентна по
    ключу'
  fix_hint: принимать idempotency_key и дедуплицировать повторные авторизации
  severity: warn
  owner: '@dka-payments'
  applies_to:
  - payment-core
- id: C-PAY-004
  name: tech_radar_hold
  type: deny_dependency
  deny:
  - anyhow
  - left-pad
  reference: Техрадар ДКА, зона HOLD
  std_ref: Стандарт платёжного ядра §5.1
  rationale: '[Стандарт платёжного ядра §5.1] библиотека из зоны HOLD (anyhow, left-pad)
    не используется'
  fix_hint: thiserror вместо anyhow; замена left-pad на штатную утилиту
  severity: warn
  owner: '@dka-tech-radar'
  closed_by:
  - tech_radar_renamed
- id: C-PAY-006
  name: tech_radar_renamed
  type: must_not_contain
  glob:
  - '**/Cargo.toml'
  pattern: package\s*=\s*"(anyhow|left-pad)"
  std_ref: Стандарт платёжного ядра §5.1
  rationale: '[Стандарт платёжного ядра §5.1] пакет из зоны HOLD подключён под другим
    именем'
  severity: warn
  owner: '@dka-tech-radar'
- id: C-PAY-007
  name: observability_standard
  unverifiable: true
  owner: '@dka-observability'
  std_ref: Стандарт платёжного ядра §6.1
  rationale: '[Стандарт платёжного ядра §6.1] метрики по стандарту наблюдаемости —
    ручной контур ревью'
- id: C-PAY-008
  name: no_float_suffix_literal
  type: must_not_contain
  glob:
  - src/**/*.rs
  pattern: '[0-9]f(32|64)\b'
  std_ref: Стандарт платёжного ядра §2.1
  rationale: '[Стандарт платёжного ядра §2.1] денежная сумма в типе с плавающей точкой,
    записанном суффиксом литерала'
  severity: warn
  owner: '@dka-payments'
  applies_to:
  - payment-core
- id: C-PAY-009
  name: no_anyhow_alias
  type: must_not_contain
  glob:
  - '**/*.rs'
  pattern: use\s+anyhow\s+as\s+
  std_ref: Стандарт платёжного ядра §3.2
  rationale: '[Стандарт платёжного ядра §3.2] anyhow подключён под другим именем'
  severity: warn
  owner: '@dka-payments'
