version: duel-1
constraints:
- name: money_float
  type: must_not_contain
  glob:
  - src/**/*.rs
  pattern: \bf(32|64)\b
  severity: block
- name: tech_radar
  type: deny_dependency
  deny:
  - anyhow
  - left-pad
  severity: block
- name: tech_radar_renamed
  type: must_not_contain
  glob:
  - '**/Cargo.toml'
  pattern: package\s*=\s*"(anyhow|left-pad)"
  severity: block
- name: idempotency
  type: must_contain
  glob:
  - src/**/*.rs
  pattern: '[Ii]dempotenc'
  severity: block
