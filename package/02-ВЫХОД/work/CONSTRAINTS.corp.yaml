# Корпоративный слой правил ДКА, домен «Платежи».
# Источник: «Стандарт платёжного ядра v2» (context/standard/payment-core-standard.md).
# Соответствие требованиям и классам — work/requirements.md.
# Сгенерировано агентом, проверено архитектором: нет.
version: "2026.1"
constraints:
  # R-01 (класс A) — §2.1. Float-типы в исходниках денежной логики.
  - id: C-PAY-001
    name: no_float_for_money
    type: must_not_contain
    glob: ["**/*.rs"]
    pattern: '\bf(32|64)\b'
    std_ref: "Стандарт платёжного ядра v2 §2.1"
    rationale: "[Стандарт платёжного ядра v2 §2.1] денежные суммы не хранятся в типах с плавающей точкой"
    severity: warn

  # R-02 (класс B, проверяется структурно) — §3.2. Ошибки описываются типизированно
  # (thiserror), а не самописными impl Display/Error. Формула must_not_contain выбрана
  # намеренно: она пусто-безопасна (не срабатывает на репозитории без исходников)
  # и даёт находку с файлом и строкой вместо «glob:0».
  - id: C-PAY-002
    name: thiserror_for_errors
    type: must_not_contain
    glob: ["src/**/*.rs"]
    pattern: '(?m)^\s*impl\s+(?:std::error::Error|std::fmt::Display|fmt::Display|Error)\s+for\s+\w*Error\b'
    std_ref: "Стандарт платёжного ядра v2 §3.2"
    rationale: "[Стандарт платёжного ядра v2 §3.2] ошибки домена описываются типизированно (thiserror), а не самописными impl Display/Error"
    severity: warn

  # R-05 (класс B) — §4.1. Идемпотентность авторизации: статически не механизуется.
  # must_contain по ключу идемпотентности неприменим: на репозитории без исходников
  # arch-be выдаёт находку на пустом наборе файлов (условий применимости у правил нет),
  # а на комментарий-упоминание ключа правило проходит ложно. Реальная проверка —
  # поведенческий тест (command_succeeds) в пилоте, вне режима --no-exec.
  - id: C-PAY-003
    name: authorize_idempotent
    unverifiable: true
    owner: "@dka-payments"
    std_ref: "Стандарт платёжного ядра v2 §4.1"
    rationale: "[Стандарт платёжного ядра v2 §4.1] идемпотентность авторизации по ключу — поведенческий тест, ручной контроль"

  # R-06 (класс A) — §5.1. Зона HOLD техрадара; anyhow попадает сюда же (пересечение с §3.2).
  - id: C-PAY-004
    name: tech_radar_hold
    type: deny_dependency
    deny: [anyhow, left-pad]
    reference: "Стандарт платёжного ядра v2 §5.1 (зона HOLD)"
    std_ref: "Стандарт платёжного ядра v2 §5.1"
    rationale: "[Стандарт платёжного ядра v2 §5.1] библиотеки из зоны HOLD техрадара не используются"
    severity: warn

  # R-07 (класс C) — §6.1. Метрики по внешнему стандарту наблюдаемости: механической проверки нет.
  - id: C-PAY-005
    name: observability_standard
    unverifiable: true
    owner: "@dka-platform"
    std_ref: "Стандарт платёжного ядра v2 §6.1"
    rationale: "[Стандарт платёжного ядра v2 §6.1] публикация метрик по стандарту наблюдаемости — ручной контроль"

  # R-04 (класс A) — §3.2. Запрет динамических ошибок; второе требование пункта.
  - id: C-PAY-006
    name: no_box_dyn_error
    type: must_not_contain
    glob: ["src/**/*.rs"]
    pattern: 'Box<\s*dyn\s+(std::error::)?Error'
    std_ref: "Стандарт платёжного ядра v2 §3.2"
    rationale: "[Стандарт платёжного ядра v2 §3.2] Box<dyn Error> запрещён, ошибки домена описываются типизированно"
    severity: warn
