version: '2026.1'
constraints:
- id: C-PAY-001
  name: no_float_for_money
  type: must_not_contain
  glob:
  - '**/*.rs'
  pattern: \bf(32|64)\b
  std_ref: Стандарт платёжного ядра v2 §2.1
  rationale: '[Стандарт платёжного ядра v2 §2.1] денежные суммы не хранятся в типах
    с плавающей точкой'
  severity: warn
- id: C-PAY-002
  name: thiserror_for_errors
  type: must_not_contain
  glob:
  - src/**/*.rs
  pattern: (?m)^\s*impl\s+(?:std::error::Error|std::fmt::Display|fmt::Display|Error)\s+for\s+\w*Error\b
  std_ref: Стандарт платёжного ядра v2 §3.2
  rationale: '[Стандарт платёжного ядра v2 §3.2] ошибки домена описываются типизированно
    (thiserror), а не самописными impl Display/Error'
  severity: warn
- id: C-PAY-003
  name: authorize_idempotent
  unverifiable: true
  owner: '@dka-payments'
  std_ref: Стандарт платёжного ядра v2 §4.1
  rationale: '[Стандарт платёжного ядра v2 §4.1] идемпотентность авторизации по ключу
    — поведенческий тест, ручной контроль'
- id: C-PAY-004
  name: tech_radar_hold
  type: deny_dependency
  deny:
  - anyhow
  - left-pad
  reference: Стандарт платёжного ядра v2 §5.1 (зона HOLD)
  std_ref: Стандарт платёжного ядра v2 §5.1
  rationale: '[Стандарт платёжного ядра v2 §5.1] библиотеки из зоны HOLD техрадара
    не используются'
  severity: warn
- id: C-PAY-005
  name: observability_standard
  unverifiable: true
  owner: '@dka-platform'
  std_ref: Стандарт платёжного ядра v2 §6.1
  rationale: '[Стандарт платёжного ядра v2 §6.1] публикация метрик по стандарту наблюдаемости
    — ручной контроль'
- id: C-PAY-006
  name: no_box_dyn_error
  type: must_not_contain
  glob:
  - src/**/*.rs
  pattern: Box<\s*dyn\s+(std::error::)?Error
  std_ref: Стандарт платёжного ядра v2 §3.2
  rationale: '[Стандарт платёжного ядра v2 §3.2] Box<dyn Error> запрещён, ошибки домена
    описываются типизированно'
  severity: warn
