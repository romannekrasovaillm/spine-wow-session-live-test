# Полезная нагрузка релиза 2026.2: закрывает разрывы §3.2 и §5.1, которые 2026.1 не проверяет.
# deny_dependency читает только манифесты, поэтому использование anyhow::/Box<dyn в коде
# и пакет из HOLD, приехавший транзитивно и зафиксированный в Cargo.lock, оставались вне контроля.
- id: C-PAY-005
  name: no_anyhow_in_code
  type: must_not_contain
  glob:
    - '**/*.rs'
  pattern: 'anyhow::|Box<dyn'
  std_ref: "Стандарт платёжного ядра §3.2"
  rationale: "[Стандарт платёжного ядра §3.2] anyhow и Box<dyn Error> запрещены в коде"
  severity: warn

- id: C-PAY-007
  name: tech_radar_lock
  type: must_not_contain
  glob:
    - '**/Cargo.lock'
  pattern: 'name = "(anyhow|left-pad)"'
  std_ref: "Стандарт платёжного ядра §5.1"
  rationale: "[Стандарт платёжного ядра §5.1] библиотека из зоны HOLD приехала транзитивно"
  severity: warn
