constraints:
- id: C-PAY-001
  name: no_float_for_money
  type: must_not_contain
  glob:
  - src/**/*.rs
  pattern: \bf(32|64)\b
  std_ref: Стандарт платёжного ядра §2.1
  rationale: '[Стандарт платёжного ядра §2.1] денежные суммы не хранятся в типах с
    плавающей точкой'
  fix_hint: заменить f32/f64 на тип с фиксированной точкой (Decimal, minor units)
  severity: warn
  applies_to:
  - payment-core
