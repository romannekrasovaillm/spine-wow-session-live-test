# Новая редакция корпоративного слоя: 2026.2.
# Закрывает обход §2.1, найденный selftest: float-литерал без имени типа
# (`let rate = 0.985;`) проходил мимо правила no_float_for_money.
# Порядок выпуска: bump → флот видит «родитель обновился» → repin осознанным PR.
constraints:
  - id: C-DKA-009
    name: no_float_literals_for_money
    type: must_not_contain
    glob: ["**/src/**/*.rs"]
    pattern: '(?m)^[^/\n]*\b\d+\.\d+\b'
    std_ref: "§2.1 Денежные суммы (ред. 2026.2)"
    rationale: "[§2.1 Денежные суммы] арифметика с плавающей точкой для денег запрещена и без явного имени типа — литерал 0.985 обходит проверку по типу"
    fix_hint: "считать в минорных единицах целыми числами (i64)"
    severity: warn
    owner: "@dka-payments"
