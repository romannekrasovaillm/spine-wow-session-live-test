version: '2026.2'
constraints:
- id: C-DKA-001
  name: no_float_for_money
  type: must_not_contain
  glob:
  - '**/*.rs'
  pattern: \bf(32|64)\b
  std_ref: §2.1 Денежные суммы
  rationale: '[§2.1 Денежные суммы] суммы не хранятся в типах с плавающей точкой:
    потеря точности и ошибки округления'
  fix_hint: перейти на целые минорные единицы (i64, копейки/центы)
  severity: warn
  owner: '@dka-payments'
- id: C-DKA-002
  name: errors_via_thiserror
  type: must_contain
  glob:
  - '**/Cargo.toml'
  pattern: thiserror
  std_ref: §3.2 Ошибки
  rationale: '[§3.2 Ошибки] доменные ошибки описываются типизированно; стандарт называет
    thiserror'
  fix_hint: 'добавить thiserror и заменить рукописные impl на #[derive(Error)]'
  severity: warn
  owner: '@dka-payments'
- id: C-DKA-003
  name: no_anyhow_in_code
  type: must_not_contain
  glob:
  - '**/*.rs'
  pattern: anyhow::|anyhow!|use anyhow
  std_ref: §3.2 Ошибки
  rationale: '[§3.2 Ошибки] anyhow скрывает тип ошибки от вызывающего; домен описывается
    типизированно'
  fix_hint: вернуть типизированный enum ошибки
  severity: warn
  owner: '@dka-payments'
- id: C-DKA-004
  name: no_box_dyn_error
  type: must_not_contain
  glob:
  - '**/*.rs'
  pattern: Box<\s*dyn\s+(::)?(std\s*::\s*error\s*::\s*)?Error
  std_ref: §3.2 Ошибки
  rationale: '[§3.2 Ошибки] Box<dyn Error> стирает тип ошибки; запрещён наравне с
    anyhow'
  fix_hint: вернуть типизированный enum ошибки
  severity: block
  owner: '@dka-payments'
- id: C-DKA-005
  name: authorize_idempotent
  type: must_contain
  glob:
  - '**/src/**/*.rs'
  pattern: idempotenc
  std_ref: §4.1 Идемпотентность
  rationale: '[§4.1 Идемпотентность] авторизация платежа идемпотентна по ключу: повторный
    вызов не должен повторять списание'
  fix_hint: принимать idempotency key и хранить исход первого вызова
  severity: warn
  owner: '@dka-payments'
- id: C-DKA-006
  name: tech_radar_hold
  type: deny_dependency
  deny:
  - anyhow
  - left-pad
  reference: Техрадар ДКА, зона HOLD
  std_ref: §5.1 Техрадар
  rationale: '[§5.1 Техрадар] библиотека из зоны HOLD запрещена к использованию'
  fix_hint: заменить библиотеку или получить ADR-исключение в реестре ДКА
  severity: block
  owner: '@dka-tech-radar'
- id: C-DKA-008
  name: tech_radar_renamed
  type: must_not_contain
  glob:
  - '**/Cargo.toml'
  pattern: package\s*=\s*"(anyhow|left-pad)"
  std_ref: §5.1 Техрадар
  rationale: '[§5.1 Техрадар] пакет из зоны HOLD подключён переименованием — запрет
    обходится сменой локального имени'
  fix_hint: убрать зависимость или оформить ADR-исключение в реестре ДКА
  severity: block
  owner: '@dka-tech-radar'
- id: C-DKA-009
  name: no_float_literals_for_money
  type: must_not_contain
  glob:
  - '**/src/**/*.rs'
  pattern: (?m)^[^/\n]*\b\d+\.\d+\b
  std_ref: §2.1 Денежные суммы (ред. 2026.2)
  rationale: '[§2.1 Денежные суммы] арифметика с плавающей точкой для денег запрещена
    и без явного имени типа — литерал 0.985 обходит проверку по типу'
  fix_hint: считать в минорных единицах целыми числами (i64)
  severity: warn
  owner: '@dka-payments'
- id: C-DKA-007
  name: observability_standard
  unverifiable: true
  owner: '@dka-platform'
  std_ref: §6.1 Наблюдаемость
  rationale: '[§6.1 Наблюдаемость] публикация метрик по стандарту наблюдаемости —
    ручной контур ревью'
